# Closed vocabulary for per-chunk tagging (creative-writing-chunk-tagger).
#
# The tagger picks tags ONLY from these four lists. If a chunk seems to
# need a tag that isn't here, the tagger must log a suggestion to
# _vocabulary_suggestions.jsonl instead of inventing one -- see
# .claude/agents/creative-writing-chunk-tagger.md. Edit this file directly
# to adopt a suggestion; re-running the backfill with --force will pick
# up the new tag on the next pass.
#
# plot_tags: mode-specific structural beats, drawn from CLAUDE.md's own
# per-mode "Structure" language, plus a few generic cross-mode beats.
plot_tags:
  # essay-self-help
  - claim-statement
  - parable-illustration
  - practice-action-item
  - closing-callback
  - over-explain-turn
  # horror-prose
  - catalogued-incident
  - incident-shelved-denial
  - escalation-stacking
  - cyclical-loop-back
  - victim-to-complicit-turn
  - threat-handoff
  - gut-punch-close
  # epic-fantasy
  - parallel-awakening
  - ensemble-convergence
  - twin-bond-recognition
  - elemental-imbalance-stake
  - cosmic-resolution
  - codex-worldbuilding-aside
  # confessional-poetry
  - anaphoric-catalog
  - rhetorical-question-pivot
  - aphoristic-landing
  - grief-processing
  - betrayal-reckoning
  - companion-piece-echo
  # generic / cross-mode
  - opening-hook
  - rising-action
  - climax-beat
  - denouement
  - exposition
  - flashback

