# Publishes the docs pages and the Writing Museum to GitHub Pages on every push to main:
#   docs/            at the site root (the pages describing each tool; not setup_keys.py or its tests)
#   writing-museum/  under museum/ (the viewer, the library page, the data and the CC0 textures)
# The museum is rebuilt from the vault at deploy time, so the library and the rooms on the site
# follow main: when a scene-3d run's scene is merged, its room is on the site a few minutes later.
# The site: https://groot99-droid.github.io/Pipelines-Plugin/  (library: museum/web/explore.html)
# The repository's Pages source must be "GitHub Actions". The "Make this workflow the Pages
# source" step tries to set it, but the workflow's token cannot change that setting (HTTP 403:
# it needs an admin token), so on a "deploy from a branch" repository it warns and the upload
# and deploy are skipped, and the run stays green. Until the owner sets the source, GitHub's own
# build publishes docs/ alone and every museum/ link answers "File not found".
# Owner's one step: Settings > Pages > Build and deployment > Source = GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the museum from the vault
        run: python writing-museum/build/build_museum.py build
      - name: Assemble the site
        run: |
          mkdir -p _site/museum
          cp -r docs/. _site/
          rm -rf _site/tests _site/__pycache__ _site/*.py
          cp -r writing-museum/web writing-museum/data writing-museum/assets _site/museum/
          touch _site/.nojekyll
          du -sh _site
      - name: Make this workflow the Pages source
        # configure-pages only creates a site; it leaves an existing "deploy from a branch"
        # site alone, and that branch build then lands after this one and drops museum/.
        # GITHUB_TOKEN cannot change the Pages source, so a refusal is a warning, not a failure.
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages build_type: $current"
          if [ "$current" = "legacy" ]; then
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow; then
              echo "Switched the Pages source to GitHub Actions."
            else
              echo "::warning title=Pages source is not GitHub Actions::The workflow token cannot change it, so the site was not deployed. Open Settings > Pages > Build and deployment, set Source to \"GitHub Actions\", then re-run this workflow (Actions > pages > Run workflow). Until then GitHub publishes docs/ alone, without museum/."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.source.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.source.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the site has the docs and the museum
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          for path in index.html museum/web/index.html museum/web/explore.html museum/data/library.json; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "${base}${path}")
              [ "$code" = "200" ] && break
              sleep 20
            done
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "::error::${base}${path} is $code after the deploy: the site was published from somewhere else, or the museum is missing from it."; exit 1; }
          done
