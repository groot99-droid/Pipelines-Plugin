# use_tags: the job an artist reaches for it to do.
use_tags:
  - sketching          # loose construction drawing: light line or tone that reads as erasable [also: sketch, sketcher, sketches, rough, drafting, draft, thumbnail, pencil sketch, underdrawing]
  - line-art           # final linework: dark, dense, controlled. Inks, liners and outlining [also: inking, inker, inkers, inked, ink, linework, line work, outline, outlining, lineart, clean lines, tech pen]
  - lettering          # made for letterforms and titles: thick-thin stress, or an even monoline with smoothing [also: letter, letters, letterform, hand lettering, titles, typography, type, text, signage]
  - calligraphy        # formal pen or brush script with set stress and flourishes [also: calligraphic, script, copperplate, brush script, chinese calligraphy, sumi calligraphy, flourish]
  - blocking-in        # covering area fast with flat opaque colour: fillers, rollers, big rounds [also: block in, block-in, blocking, fill, filling, flats, flat colour, base colour, big brush]
  - painting-broad     # painterly work on a large scale: visible strokes that build form like oil or acrylic [also: painting, painterly, paint, impressionist, impressionism, expressive, oil painting]
  - shading            # building tone gradually over a drawing: shaders, pencils on their side, hatching [also: shade, shader, shaders, shaded, tone, tonal, modelling, modeling, form shading, comic shading]
  - blending           # moving or softening paint already there; named a smudge, blender or smudger, or lays no pigment of its own [also: blend, blender, blenders, smudge, smudger, smudging, soften, softening, smooth transitions]
  - glazing            # thin transparent layers over a large area [also: glaze, glazes, tinting, transparent layers, veil]
