# motif_tags: recurring named images/symbols/archetypal devices, partly
# grounded in the vault's actual `archetypes` frontmatter values.
motif_tags:
  - architecture
  - threshold
  - tide-and-water
  - naming-and-labeling
  - inventory-and-catalogue
  - mirror-and-reflection
  - fire
  - hunger
  - inheritance-object
  - ringing-bell
  - hands-and-grip
  - twin-souls-bond
  - doppelganger-and-shadow
  - cursed-object
  - found-document-framing
  - witness-and-observer
  - complicit-authority-figure
  - monster-from-victim
  # registers -- see _Craft/
  - clock-and-hour             # a clock, an hour or a count keeps the door: 10:00 precisely, 2:22, an alarm, "no time, no date"
  - descent-and-depth          # going down as the shape of the journey: the pupil pit, the abyss, the marrow tunnels
  - eye-and-gaze               # the eye, the watcher, being seen: the eye in the sky, the eye as a planet, the peephole
  - nested-world               # a world inside a thing that looks small: a book, an eye, a tree, a body
  - sound-as-substance         # adopted (The Yellow Drop): sound as the matter a world is built from
  - textual-tampering          # adopted (Redacted Testament): overwritten, corrupted or redacted text as an evidentiary device
  - marginal-annotation        # adopted (Redacted Testament): a second hand in the margins
  - document-takeover          # adopted (Through the Eyes of Wolf and Lamb): a narrator's manuscript overwritten by an institutional voice
  - performance-and-spectacle  # adopted (The Show Must Go On): a life framed as a broadcast, a sitcom, a show
