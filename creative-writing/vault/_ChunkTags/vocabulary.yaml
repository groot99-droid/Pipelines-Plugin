  - loss
  - isolation
  - loneliness
  - betrayal
  - complicity
  - self-knowledge
  - self-preservation
  - identity
  - transformation
  - memory-and-forgetting
  - inheritance-and-legacy
  - mortality
  - family
  - love
  - trust-and-distrust
  - courage
  - resilience
  - self-worth
  - bodily-autonomy
  - body-horror
  - institutional-indifference
  - institutional-control
  - cosmic-imbalance
  - cyclical-violence
  - forgiveness
  - redemption
  - ambition
  - creative-anxiety
  - existential-dread
  - paranoia
  - surveillance
  - poverty-and-inequality
  - coming-of-age
  - self-deception
  - unreliable-reality
  # registers -- see _Craft/
  - liminality                 # the condition of being between states as the piece's subject (not the word "threshold" used figuratively)
  - ego-dissolution            # the self comes apart or is emptied out (Trip Tracker, Trips Are Like Exes)
  - cosmic-dread               # dread from scale and indifference rather than from a threat; the vault's own frontmatter word (Missing Campsites)
  - erasure                    # things, places or people removed from the world and from memory; the vault's own frontmatter word (Missing Campsites)
  - altered-perception         # adopted (Trip Tracker): perceptual distortion or expansion is the chunk's subject

