# Runs the plugin's one gate, maintenance/verify.py, on the platforms it is meant
# to work on. verify.py runs ten checks (data, contract, indexes, unit tests, the
# relevance gate, and a smoke test of every domain and stack) and stops at the
# first failure.
#
# This file lives in the plugin folder, not at the Pipelines repo root. GitHub only
# reads .github/ at the top of a repository, so it is inert inside the Pipelines
# monorepo and takes effect once plugins/ui-design/ is published as its own repo.
#
# The Windows and macOS jobs also prove the LF pin: the relevance gate fingerprints
# raw bytes, and a Windows runner checks files out with CRLF unless .gitattributes
# says otherwise.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the maintenance dependency
        run: python -m pip install -r maintenance/requirements.txt
      - name: Run every gate
        run: python maintenance/verify.py
