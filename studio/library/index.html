<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generations Library</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #dedad3;
    --accent: #3b5bdb; --chip: #ecebe7; --shade: rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --ink: #ecebe7; --muted: #9b978f; --line: #33322f;
            --accent: #8ea2ff; --chip: #2a2927; --shade: rgba(0,0,0,.75); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { font-size: 17px; margin: 0 12px 0 0; }
  .count { color: var(--muted); font-size: 13px; }
  .types { display: flex; gap: 4px; flex-wrap: wrap; }
  .types button, select, input[type=search] {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  .types button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=search] { flex: 1 1 220px; min-width: 0; background: var(--panel); }
  main { padding: 16px; display: grid; gap: 10px;
         grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
          cursor: pointer; padding: 0; text-align: left; font: inherit; color: inherit; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { aspect-ratio: 1; background: var(--chip); display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .glyph { font-size: 28px; color: var(--muted); }
  .meta { padding: 7px 9px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .meta b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { grid-column: 1 / -1; justify-self: center; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
  dialog { border: 0; padding: 0; background: var(--panel); color: var(--ink); border-radius: 10px;
           width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: var(--shade); }
  .detail { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  @media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
  .stage { background: #000; display: grid; place-items: center; min-height: 320px; max-height: calc(100vh - 32px); }
  .stage img, .stage video { max-width: 100%; max-height: calc(100vh - 32px); display: block; }
  .stage audio { width: 90%; }
  .stage model-viewer { width: 100%; height: min(70vh, 640px); }
  .info { padding: 16px; overflow: auto; max-height: calc(100vh - 32px); }
  .info h2 { font-size: 15px; margin: 0 0 4px; }
  .info .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .prompt { white-space: pre-wrap; font-size: 14px; background: var(--chip); border-radius: 6px; padding: 10px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 12px 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .actions a, .actions button { font: inherit; font-size: 13px; color: var(--accent); background: none;
           border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; text-decoration: none; cursor: pointer; }
  .close { position: absolute; top: 8px; right: 8px; z-index: 1; font-size: 18px; line-height: 1;
           background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 50%;
           width: 32px; height: 32px; cursor: pointer; }
  .src { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Generations Library</h1>
  <span class="count" id="count">loading…</span>
  <div class="types" id="types"></div>
  <select id="model" aria-label="Model"><option value="">All models</option></select>
  <input type="search" id="q" placeholder="Search prompts, models, ids" aria-label="Search">
</header>
<main id="grid"></main>
<dialog id="dlg"><button class="close" id="close" aria-label="Close">×</button><div class="detail">
  <div class="stage" id="stage"></div><div class="info" id="info"></div>
</div></dialog>
<script>
const GLYPH = { image: "▢", video: "▶", audio: "♪", "3d": "◆" };
const PAGE = 120;
const state = { items: [], byId: {}, type: "", model: "", q: "", shown: PAGE };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const localPath = (e) => `files/${e.type}/${e.id}.${e.ext || "bin"}`;

function filtered() {
  const q = state.q.toLowerCase();
  return state.items.filter((e) =>
    (!state.type || e.type === state.type) &&
    (!state.model || e.model === state.model) &&
    (!q || e.prompt.toLowerCase().includes(q) || e.model.toLowerCase().includes(q) || e.id.startsWith(q)));
}

function render() {
  const list = filtered();
  $("count").textContent = `${list.length} of ${state.items.length}`;
  const grid = $("grid");
  grid.innerHTML = list.length ? "" : '<p class="empty">Nothing matches.</p>';
  for (const e of list.slice(0, state.shown)) {
    const card = document.createElement("button");
    card.className = "card";
    card.dataset.id = e.id;
    card.title = e.prompt || e.model;
    card.innerHTML = `<div class="thumb"><img loading="lazy" alt="" src="thumbs/${e.id}.webp"></div>
      <div class="meta"><b>${esc(e.model)}</b><span>${e.created.slice(0, 10)}</span></div>`;
    card.querySelector("img").onerror = (ev) => { ev.target.replaceWith(Object.assign(document.createElement("span"), { className: "glyph", textContent: GLYPH[e.type] })); };
    card.onclick = () => showItem(e.id);
    grid.append(card);
  }
  if (list.length > state.shown) {
    const more = document.createElement("button");
    more.className = "card more";
    more.style.padding = "8px 16px";
    more.textContent = `Show more (${list.length - state.shown} left)`;
    more.onclick = () => { state.shown += PAGE; render(); };
    grid.append(more);
  }
}

// Prefer the downloaded original (library.py fetch); fall back to Higgsfield's copy.
async function source(e) {
  try { const r = await fetch(localPath(e), { method: "HEAD" }); if (r.ok) return [localPath(e), "local file"]; } catch (_) {}
  return [e.url, "Higgsfield"];
}

let viewerLoaded = false;
function loadViewer() {
  if (viewerLoaded) return;
  viewerLoaded = true;
  const s = document.createElement("script");
  s.type = "module";
  s.src = "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
  document.head.append(s);
}

async function showItem(id) {
  const e = state.byId[id];
  if (!e) return;
  history.replaceState(null, "", `#${id}`);
  const stage = $("stage");
  stage.innerHTML = "";
  const [src, where] = await source(e);
  if (e.type === "image") stage.innerHTML = `<img alt="" src="${esc(src)}">`;
  if (e.type === "video") stage.innerHTML = `<video controls playsinline poster="thumbs/${e.id}.webp" src="${esc(src)}"></video>`;
  if (e.type === "audio") stage.innerHTML = `<audio controls src="${esc(src)}"></audio>`;
  if (e.type === "3d") { loadViewer(); stage.innerHTML = `<model-viewer camera-controls auto-rotate shadow-intensity="1" poster="thumbs/${e.id}.webp" src="${esc(src)}"></model-viewer>`; }
  const settings = Object.entries(e.settings || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const inputs = (e.inputs || []).map((i) => state.byId[i.id]
    ? `<a href="#${i.id}" data-open="${i.id}">${esc(state.byId[i.id].type)} ${i.id.slice(0, 8)}</a>`
    : `<span>${esc(i.type || "input")} ${i.id.slice(0, 8)}</span>`).join(", ");
  const usedBy = state.items.filter((o) => (o.inputs || []).some((i) => i.id === e.id))
    .map((o) => `<a href="#${o.id}" data-open="${o.id}">${esc(o.type)} ${o.id.slice(0, 8)}</a>`).join(", ");
  $("info").innerHTML = `<h2>${esc(e.model)}</h2>
    <div class="sub">${esc(e.type)} · ${e.created.replace("T", " ").replace("Z", " UTC")}${e.duration_sec ? ` · ${e.duration_sec}s` : ""}</div>
    ${e.prompt ? `<div class="prompt">${esc(e.prompt)}</div>` : '<p class="src">No prompt.</p>'}
    <dl><dt>id</dt><dd>${e.id}</dd>${settings}
      ${inputs ? `<dt>made from</dt><dd>${inputs}</dd>` : ""}${usedBy ? `<dt>used by</dt><dd>${usedBy}</dd>` : ""}</dl>
    <div class="actions"><a href="${esc(src)}" download target="_blank" rel="noopener">Open original</a>
      <button id="copy">Copy prompt</button></div>
    <p class="src">Playing from: ${where}${where === "Higgsfield" ? ` — run <code>library.py fetch --id ${e.id}</code> to keep a copy` : ""}</p>`;
  $("copy").onclick = () => navigator.clipboard.writeText(e.prompt || "");
  $("info").querySelectorAll("[data-open]").forEach((a) => a.onclick = (ev) => { ev.preventDefault(); showItem(a.dataset.open); });
  if (!$("dlg").open) $("dlg").showModal();
}

function closeDlg() { $("dlg").close(); }
$("close").onclick = closeDlg;
$("dlg").addEventListener("close", () => { $("stage").innerHTML = ""; history.replaceState(null, "", location.pathname); });
$("dlg").addEventListener("click", (ev) => { if (ev.target === $("dlg")) closeDlg(); });

fetch("catalog.json").then((r) => r.json()).then((cat) => {
  state.items = cat.items;
  for (const e of cat.items) state.byId[e.id] = e;
  const types = $("types");
  for (const [t, label] of [["", `All ${cat.count}`], ...["image", "video", "audio", "3d"].map((t) => [t, `${t === "3d" ? "3D" : t[0].toUpperCase() + t.slice(1)} ${cat.counts[t]}`])]) {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", String(t === state.type));
    b.onclick = () => { state.type = t; state.shown = PAGE; types.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); render(); };
    types.append(b);
  }
  for (const m of [...new Set(cat.items.map((e) => e.model))].sort()) $("model").append(new Option(m, m));
  render();
  if (location.hash.length > 1) showItem(location.hash.slice(1));
}).catch(() => {
  $("count").textContent = "";
  $("grid").innerHTML = '<p class="empty">catalog.json did not load. Serve this folder: <code>python -m http.server 8770 --directory studio/library</code></p>';
});
$("model").onchange = (ev) => { state.model = ev.target.value; state.shown = PAGE; render(); };
$("q").oninput = (ev) => { state.q = ev.target.value.trim(); state.shown = PAGE; render(); };
</script>
</body>
</html>
