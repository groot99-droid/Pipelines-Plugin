# Studio pipeline spec -- the single source of truth for the studio-pipeline
# skill (.claude/skills/studio-pipeline/SKILL.md at the Pipelines root) and the
# bookkeeper (studio_run.py, content_md.py).
#
# Neither consumer keeps stage text, gate names or pipeline rules of its own --
# both read this file. Rules here summarise and point back to
# studio/vault/CLAUDE.md; they do not replace it. If CLAUDE.md changes, update
# the matching block here.
#
# Paths: vault_root, context_root and runs_root are relative to THIS FILE's
# directory. A gate's `file:` and `tokens.file` are relative to
# context_root. Paths under `executes_through:` are relative to the repo root.
#
# Where these ideas came from, and what changed on the way, is recorded in
# studio/docs/IDEAS.md.

version: 1

vault_root: "../vault"
context_root: "../vault/_Context/brand"
runs_root: "runs"

# One mode. Every stage is a checkpoint: the skill stops at each one, shows
# the author that stage's output, and waits. There is no autonomous mode here.
# The bookkeeper cannot tell whether the author reviewed a stage; it advances
# when `advance` is run and the stage's checks pass.

# --------------------------------------------------------------------
# The Content MD -- machine-readable form of studio/vault/SCHEMA.md.
# content_md.py lints against this block.
# --------------------------------------------------------------------
content_md:
  type: "content-md"
  id_pattern: "^cmd_[0-9]{8}_[a-z0-9]+(-[a-z0-9]+)*$"
  required: [id, type, kind, title, status, created, updated]
  optional: [project, pipelines, context_brand, context_domain, artifacts, tags]
  immutable: [id, type, created]
  kinds: [character, design, audio, video, 3d, brush, copy, ui, world, other]
  statuses: [seed, in-progress, blocked, complete, archived]
  sections:
    - Overview
    - Next Steps
    - Timeline
    - Method
    - Decisions in Force
    - Open Questions
    - Contradictions
    - Links
  always: [Overview]
  # A finished thing may have no next step. Writing a filler one is worse than
  # writing none.
  next_steps_optional_when: [complete, archived]
  # File names that are never a Content MD, in any case. No folder of notes
  # may carry one of these names either.
  reserved_names: [SCHEMA.md, README.md, CLAUDE.md]

# --------------------------------------------------------------------
# The ten brand gates: which exist, and what each must answer.
#
# A gate is authored when its file is at context_root/<file>. What it answers
# and what it declares it does NOT answer are read from the file's own
# headings (`## N. Title`, and `## N. Unresolved`), by studio_common.py
# gate_sections. They are not repeated here, so replacing a gate file is the
# whole of replacing a gate.
#
# "Authored" is not "complete". A constraint the gate's Unresolved section
# names is unresolved even though the file exists.
#
# `scope` is this spec's one-line summary of a gate, printed by `facts`. It is
# not a source: an attestation cites the gate file.
# --------------------------------------------------------------------
gates:
  visual_identity:
    file: "visual_identity.context.md"
    must_answer: "What does work from this studio look like? Motifs, framing, texture, what is off-limits."
    scope: "The studio's own surfaces. Product and client work is not bound by it."
  typography_system:
    file: "typography_system.context.md"
    must_answer: "Typefaces, scale, tracking, hierarchy, licensing."
    scope: "The studio's own surfaces. Product and client work selects its own pairing."
  color_science:
    file: "color_science.context.md"
    must_answer: "Working space, LUTs, palette with hex values, grading rules."
    scope: "A UI token set in sRGB hex. Not a colour-managed pipeline."
  motion_language:
    file: "motion_language.context.md"
    must_answer: "Camera grammar, easing, shot lengths, transitions to avoid."
  sound_identity:
    file: "sound_identity.context.md"
    must_answer: "Instrumentation, tempo range, mix targets, sonic signature."
  brand_voice:
    file: "brand_voice.context.md"
    must_answer: "Diction, register, person, banned phrasings."
  narrative_continuity:
    file: "narrative_continuity.context.md"
    must_answer: "Canon rules, character and environment persistence, what may not be retconned."
  render_philosophy:
    file: "render_philosophy.context.md"
    must_answer: "Quality bar, when to re-render and when to accept, output specs."
  pipeline_ethics:
    file: "pipeline_ethics.context.md"
    must_answer: "Disclosure, provenance, sourcing rules, what is never generated."
  memory_discipline:
    file: "memory_discipline.context.md"
    must_answer: "Quotable against summarizable, retention, what leaves the machine."

# The token dictionary the three authored gates were transcribed from. In
# Creative-Headquarters it was embedded in a skill file as "ARTIFACT A"; here it
# is a file beside the gates.
tokens:
  file: "tokens.json"
  mutation_policy: "The author commits. An agent proposes a change as a diff and stops."

# Places where carried files disagree with each other or with this repo. They
# are carried unchanged: settling them is the author's decision.
known_conflicts:
  - id: font-weights
    where:
      - "tokens.json font.policy"
      - "tokens.json type_scale weight.mid"
      - "typography_system.context.md section 2"
      - "visual_identity.context.md section 6"
    what: >
      The policy, typography_system section 2 and visual_identity section 6 all
      say two weights and no third. Section 2 then allows 500 as one in-between
      step for a status word, and says it is not a third role. tokens.json
      declares weight.mid 500.
    until_settled: >
      500 is for a status word only, as typography_system section 2 says. No
      other use of a third weight.
  - id: carried-paths
    where:
      - "all three gate files, section 0"
      - "color_science.context.md section 4"
      - "typography_system.context.md section 5"
    what: >
      The provenance sections cite Creative-Headquarters paths. "ARTIFACT A" is
      tokens.json beside them. "control_room.html" and "check_palette_parity"
      were left behind. "DECISIONS.md" is summarised in studio/docs/IDEAS.md.
      The `tools/ui-ux-pro-max/` commands and files in color_science section 4
      and typography_system section 5 are under plugins/ui-design/catalog/
      here: scripts/search.py, and data/ for the font licences.
    until_settled: "Read the constraints. Do not follow the paths."

# --------------------------------------------------------------------
# The ladder -- how a needed constraint is resolved in the context stage.
# studio/vault/CLAUDE.md is authoritative; this is its machine-readable form.
# --------------------------------------------------------------------
#
# A row of the attestation has a LEVEL (how the constraint was resolved) and a
# STATE (whether the run may go on). `source` is what the row's Source cell
# must hold; studio_run.py checks it.
ladder:
  levels:
    L0:
      name: AUTHORED
      rule: "The gate file exists and the constraint is not in that gate's unresolved list."
      source: "the gate file and `section N`. N is a section the gate answers, not one it declares unresolved"
      state: resolved
    L1:
      name: RECALLED
      rule: "A note whose context_brand names the gate states the constraint in its Decisions in Force."
      source: '[[note]] and the line in double quotes, copied exactly as the note has it'
      state: resolved
    L2:
      name: DERIVED
      rule: >
        No note states it. It is inferred from at least three notes of the same
        kind, weighting a complete note over one in progress and a recent note
        over an old one.
      source: "every note the inference drew on, as [[note]]"
      state: PROVISIONAL
      min_notes: 3
    STATED:
      name: STATED
      rule: "The author states the constraint at the context checkpoint."
      source: "the author, and the date as YYYY-MM-DD"
      state: resolved
    L3:
      name: UNRESOLVED
      rule: "None of the above. Ask the author. If the author does not answer, park."
      source: "nothing"
      state: UNRESOLVED
  states: [resolved, PROVISIONAL, UNRESOLVED]
  unresolved_marker: "UNRESOLVED"
  provisional_marker: "PROVISIONAL"

# --------------------------------------------------------------------
# Refusals. `enforced_by` names what checks the rule, and `limit` says what
# that check cannot see. "the skill" means no code can check it and the rule
# rests on the instructions being followed.
#
# Every check below reads what the skill wrote. None can tell whether what
# was written is true.
# --------------------------------------------------------------------
refusals:
  - id: stub-pipeline
    rule: "A pipeline whose status is not `implemented` does not start."
    enforced_by: "studio_run.py new"
  - id: execute-without-context
    rule: "No tool is called for a made thing before its context is attested."
    enforced_by: "the skill. studio_run.py advance will not mark context done without a whole attestation"
    limit: "A tool call cannot be refused. The order of stages is kept; what is called outside them is not seen."
  - id: unresolved-context
    rule: "A run with an unresolved constraint does not advance. It is answered or parked."
    enforced_by: "studio_run.py advance, at the context stage"
    limit: >
      It checks that every needed constraint has exactly one row, that no row
      is at L3 or in a state other than resolved or PROVISIONAL, and that an
      L0 row names its own gate's file and no section the gate declares
      unresolved. It cannot tell whether the section cited really states the
      constraint, and it does not check that the level chosen is the first
      one on the ladder that holds.
  - id: derived-as-authored
    rule: "A derived constraint is always marked provisional, with its sources."
    enforced_by: "studio_run.py advance at the context stage, and content_md.py plan at every write after it"
    limit: "It holds for a row whose level says it was derived. A derivation written down as L0 is not seen."
  - id: provisional-kept
    rule: >
      A PROVISIONAL decision stays provisional. Recalled, it is still
      PROVISIONAL, and a later write keeps it until the author states the
      constraint.
    enforced_by: "studio_run.py advance at the context stage, and content_md.py plan"
    limit: "It compares the decision's text. A hand edit in Obsidian is not seen."
  - id: record-by-record
    rule: "The record stage ends with a record write, made after the record go-ahead. A flush or a park does not finish it."
    enforced_by: "studio_run.py advance, at the record stage"
  - id: spend-without-confirm
    rule: "Nothing that spends credits, runs heavy compute or writes outside the run folder happens before the author confirms."
    enforced_by: "the skill. studio_run.py confirm records the go-ahead; advance checks one was recorded, and that execute_log.md is not older than it"
    limit: "A tool call cannot be refused, and the go-ahead is recorded on the skill's word."
  - id: untaken-step
    rule: "A Timeline entry records only what was done. It is built from execute_log.md and review.md, never from recipe.md."
    enforced_by: "the skill"
  - id: timeline-rewrite
    rule: "An existing Timeline entry is never edited. A wrong one is corrected by a new one."
    enforced_by: "content_md.py plan"
    limit: "Only for a note written through content_md.py. An edit made by hand in Obsidian is not seen."
  - id: vault-write-without-confirm
    rule: "Nothing is written into the vault without a preview and the author's yes."
    enforced_by: "content_md.py apply"
    limit: "The yes is recorded on the skill's word. A file written into the vault by any other tool is not seen."
  - id: bearer-link-in-note
    rule: "A note never holds a presigned or share link, or a credential."
    enforced_by: "content_md.py lint"
    limit: "It knows signed query parameters, the share links of a few hosts, and a few key prefixes. A shape it does not know passes."
  - id: one-note-per-run
    rule: "A run reads and writes one note. Once it has written, it cannot be pointed at another."
    enforced_by: "studio_run.py note"
  - id: note-placement
    rule: >
      A run writes a note only at <project>/<kind>/<slug>.md, where <kind> is
      the kind its pipeline makes. Nothing at the vault root, and nothing under
      a folder that starts with _ or .
    enforced_by: "studio_run.py note, content_md.py plan"
  - id: writing-vault
    rule: "Nothing under creative-writing/vault/ is read into a brief, a recipe or a prompt unless the author names the work at a checkpoint."
    enforced_by: "the skill"
  - id: invented-gate
    rule: "A brand gate is never generated. It is transcribed from the author's answers."
    enforced_by: "the skill, and gate_md.py plan, which refuses a gate whose Provenance does not name the author, a date in the run and the run"
    limit: "It cannot tell whether the words came from the author. The whole file is shown at the checkpoint for the author to judge."
  - id: gate-write-without-confirm
    rule: "Nothing is written into the gate folder without showing the author the whole gate and hearing yes."
    enforced_by: "gate_md.py apply"
    limit: "The yes is recorded on the skill's word. A gate edited by hand is not seen; gate_md.py lint reads it afterwards."

# Connector tools no pipeline may call, matched as a substring of the tool's
# name. Advisory: the executor is a model following instructions. Permission
# rules in .claude/settings.json are the enforcement, and they are the author's
# to set.
connectors:
  never: [share, publish, invite, deploy, presigned, send_message, tiktok]

# --------------------------------------------------------------------
# Pipelines. One entry per kind of made thing.
#
# Add an entry with `status: implemented` to extend the studio to another
# kind. The six stages below work unchanged: they read the entry's rules out of
# this file.
#
# `requires_context` is stated at the level of the constraint, not the file:
# which gate, and what is needed from it.
#
# `class`: none | spend | local-compute
# --------------------------------------------------------------------
pipelines:
  ui-direction:
    status: implemented
    from: "skills/ui_ux_intelligence.skill.md"
    kind: ui
    makes: "A design direction for one surface or product: pattern, style, palette, type, effects, and what to avoid."
    intent:
      - design system
      - palette
      - colour scheme
      - font pairing
      - typography scale
      - style direction
      - UX review
      - accessibility audit
      - what should this look like
      - spacing scale
      - chart type
      - icon set
    requires_context:
      - gate: visual_identity
        needs: ["interface identity", "off-limits list", "that product work is not bound by it"]
      - gate: typography_system
        needs: ["the studio scale", "its tension with the catalog's 16px body minimum", "scope boundary"]
      - gate: color_science
        needs: ["palette", "semantic binding", "the three contrast floors"]
    executes_through:
      # repo-root paths. The plugin is read-only from here: it is published,
      # and its catalog files are fingerprinted.
      engine: "plugins/ui-design/catalog/scripts/search.py"
      router: "plugins/ui-design/catalog/scripts/route.py"
      contract: "plugins/ui-design/spec.yaml"
      guide: "plugins/ui-design/skills/ui-design-catalog/SKILL.md"
    connector:
      tools: []
    class: none
    leaves_machine: "Nothing. The catalog is local and the engine makes no network call."
    open:
      - >
        visual_identity states no scope for the whole gate. Section 2 says only
        that product work is not bound by the no-light-mode rule. Until the
        author adds a scope, the need `that product work is not bound by it`
        resolves as STATED, or at L1 from a note that recorded it. The
        `scope:` under `gates:` is this spec's summary, not a source.
    consumers:
      studio-surface:
        what: "One of the studio's own interfaces."
        authority: "tokens.json and the brand gates this pipeline requires."
        role: "Propose only. A change is a diff against tokens.json, with what it would break. The author commits or does not."
        persist: "never"
      product:
        what: "Anything made for a project or a client."
        authority: "That project's own design system."
        role: "Sole author. The studio palette and typeface do not travel."
        persist: "only with an output directory the author has named, outside this repo"
    stage_notes:
      intake: |
        Establish the consumer first: studio surface, or product work. Never
        guess it. Everything after branches on it.
        Capture in the author's words: what is being designed, who uses it and
        where, and any style words they used.
        Detect the stack from the project (package.json, pubspec.yaml,
        Package.swift, composer.json). If nothing is detectable and stack
        guidance matters, ask. Never assume a stack.
        For product work, ask whether a design system for this project already
        exists, and where. If it does, read its MASTER.md before anything else.
        The first line of brief.md is `consumer: studio-surface` or
        `consumer: product`.
      recipe: |
        Read {pipeline.executes_through.contract} and
        {pipeline.executes_through.guide} first. They define the search modes,
        domains, flags and exit codes. Do not invent one. The guide starts its
        paths from ${CLAUDE_PLUGIN_ROOT}; here that is plugins/ui-design.
        For a brief in the author's own wording, run
        {pipeline.executes_through.router} on it and record what it chose and
        any warning it printed.
        List every search that will be run: the mode, the domain or stack, the
        query (one intent, two to five terms, in the catalog's own words), any
        dial, and why this search. For each, name the one retry allowed if it
        comes back empty or off-topic: a narrower query, or an explicit
        --domain.
        For product work, say whether the result is to be persisted, and name
        the output directory that will be asked for at execute.
        For a studio surface, say that nothing will be persisted.
      execute: |
        Run each search from the recipe with --json. Add no search that is not
        in the recipe. If one is needed, go back to recipe:
          python studio/pipeline/studio_run.py back <run-id> --why "<what is missing>"
        After each: check the matched category and the top result against the
        brief before using anything. If it is empty or off-topic, run the one
        retry the recipe names for that search, and no other. If the retry
        fails, say that no match was found. Never present an unmatched result
        as a match.
        Studio surface: never pass --persist.
        Product work: pass --persist only with --output-dir set to the
        directory the author named at this confirm. Never inside this repo.
        Never pass --force unless the author said so in those words.
        Log each command as run, its exit code, and what it returned:
          --design-system: the matched category, and the source_identities and
            source_derivations it returned.
          --domain or --stack: the domain or stack, the file it searched, and
            the top row's Category and Issue (Guideline, for a stack).
      review: |
        Check the matched category is the one the brief describes.
        Check the contrast report: text pairs at 4.5:1.
        Studio surface: write the proposed change by hand, as a diff against
        the colours in tokens.json. Name each value that would move. Compute
        the contrast floors the attestation resolved from those values. Do
        not take them from the engine's report, which measured its own
        palette. Check the off-limits list the attestation resolved. Where
        the catalog's guidance and the attested scale disagree, the attested
        scale holds.
        Product work: check the anti-patterns the engine returned, and that
        nothing from the studio palette or typeface was carried in.
      record: |
        kind: ui.
        Method: every query as run, the resolved values, and where each came
        from: for --design-system both provenance fields; for --domain and
        --stack the domain, the file, and the top row's category and issue.
        A later session must be able to tell a matched value from a derived one.
        Product work: the design decisions go to Decisions in Force.
        Studio surface: a proposal is NOT a decision in force. It goes to Next
        Steps as the item awaiting the author, with the diff in a fenced block
        under that item. It moves to Decisions in Force only when the author
        has changed tokens.json. A run that proposes nothing says so in its
        Timeline entry, and what is still open goes under Open Questions.

  ui-build:
    status: not_yet_implemented
    from: "skills/css_html_ui.skill.md"
    kind: ui
    makes: "Markup and CSS for one surface, in which every value is a token."
    requires_context:
      - gate: typography_system
        needs: ["family, scale, hierarchy"]
      - gate: visual_identity
        needs: ["interface identity", "structural discipline", "off-limits list"]
      - gate: brand_voice
        needs: ["how controls and labels are worded"]
    executes_through:
      capability: "render and measure in a browser"
    class: none
    carries:
      - "Tokens are law: a value with no token is proposed to the author, not invented."
      - "Never change a file that was not read in this run."
      - "Render at each breakpoint before calling a surface done. Four bugs in the control room appeared only on rendering."
      - "Script never sets a colour or a background as a literal. It toggles a class backed by a token."
      - "A status maps to a class exactly as the token dictionary's semantic table says."
      - "A new region is a grid area, not an absolutely positioned patch."
      - "Anything written as HTML from data passes through an escape function first."
    open:
      - "brand_voice is not authored. Until it is, the context stage asks for it."
      - "The source skill's copy rules (sentence case, plain verbs, a control named for what it does) are brand_voice's to state. They are not carried as rules here."
      - "Where a build is written. The source skill named no directory."

  brand-gate:
    status: implemented
    from: "context/brand/README.md"
    kind: other
    makes: "One brand gate, transcribed from the author's answers."
    # It writes a gate as well as its note: `gate` names which, at intake,
    # and gate_md.py writes it at record.
    writes: gate
    requires_context: []
    checks:
      intake: [gate_set]
      record: [gate_written]
    executes_through:
      writer: "studio/pipeline/gate_md.py"
    connector:
      tools: []
    class: none
    leaves_machine: "The author's answers pass through this Claude Code session. Nothing else leaves."
    carries:
      - "A gate encodes taste and prior decisions. It is never generated."
      - "A question the author does not answer goes under an Unresolved heading. It is never filled from a library or the catalog."
      - "The whole file is shown before it is written."
      - "A provenance section states who answered, and when."
    stage_notes:
      intake: |
        Settle which gate this run writes, from `gates:` in the spec, and set it:
          python studio/pipeline/studio_run.py gate <run-id> <gate>
        Say whether it is new or rewrites the gate on disk. If it rewrites one,
        read that file in full now.
        The note records how the gate was made. Propose its path,
        <project>/other/<gate>.md, or one-offs/other/<gate>.md when the author
        names no project.
      recipe: |
        List the questions the interview will ask, in order. Take them from
        the gate's `must_answer` in the spec, one question for each thing it
        names. For a rewrite, add one question for each section on disk: keep
        it, change it, or drop it.
        Ask nothing else. A question the recipe does not hold is added by going
        back to recipe, not asked in passing.
      execute: |
        This is the interview. Ask each question in the recipe, in order, and
        write execute_log.md as a transcript as it happens: the question, then
        the author's answer in quotes, verbatim. A question the author does not
        answer is logged as "no answer".
        Do not offer answers for the author to pick from. If the author asks
        for options, say that a gate records the author's taste and options
        would be generated; offer to put the question another way instead.
      review: |
        Build the gate from the transcript and nothing else, as gate_update.md
        in the run folder:
          # <gate>
          ## 0. Provenance   the author answered, the date, this run's id, and
                             that it was transcribed from execute_log.md
          ## 1. <Title>      one numbered section for each thing answered, in
                             the author's words
          ## N. Unresolved   last: each unanswered question, as a bullet
        In review.md, beside each section, the transcript answer it came from.
        Show the author the whole gate.
      record: |
        Write the gate first:
          python studio/pipeline/gate_md.py plan <run-id>
        Show the author gate_plan.md, which holds the whole gate. Only after a
        clear yes:
          python studio/pipeline/studio_run.py confirm <run-id> gate --words "<what the author said>"
          python studio/pipeline/gate_md.py apply <run-id> --confirm
        Then the note. kind: other. context_brand names the gate written. The
        Timeline entry says the gate was written or rewritten, and how many
        questions were answered and left unresolved. Method lists the
        questions. A gate is its own decision, so Decisions in Force names
        nothing the gate itself does not say.

  brush:
    # The packer is built. The pipeline starts once the designer app is in
    # place at studio/hub/brush/ (copied from the author's machine, its
    # Procreate export removed) and `app:` below points at a real file.
    status: not_yet_implemented
    from: "DECISIONS.md D2; tools/brush-designer/"
    kind: brush
    makes: "A brush: its parameters, its shape and grain, and a file Procreate imports."
    intent:
      - brush
      - brush set
      - procreate brush
      - stipple
      - grain
      - tip shape
    requires_context:
      - gate: visual_identity
        needs: ["generated imagery: motifs, texture"]
    executes_through:
      app: "studio/hub/brush/index.html"
      packer: "studio/pipeline/brush_pack.py"
    connector:
      tools: []
    class: none
    leaves_machine: "Nothing. The designer runs in the browser on loopback and the packer is local."
    carries:
      - "The brush is a capability the studio calls, not a panel it links to (D2)."
      - "A brush's parameters are its Method: the note must be enough to rebuild it."
    open:
      - "The designer app is not yet under studio/hub/brush/. It is copied from the author's machine; its bplist export and its Ollama tab are left behind."
      - "Whether Procreate imports the packed file is settled by importing one. A Procreate-written .brush under studio/pipeline/tests/fixtures/procreate/ turns the packer's fixture test on."
    stage_notes:
      intake: |
        Capture what the brush is for (inking, texture, wash), which app it
        targets (Procreate, or another through the Universal Kit), and any
        brush the author names as a starting point. Propose the note's path,
        <project>/brush/<slug>.md, or one-offs/brush/<slug>.md.
      recipe: |
        Name the parameters the author has decided (spacing, taper, grain
        depth, blend mode, and so on), each with its source: the brief, a
        Decision in Force, or the attestation. A parameter the author has not
        decided is left to the designer session and said so. Name the files:
        the bundle the designer exports into the run folder, and the .brush or
        .brushset the packer writes there. Nothing is written outside the run
        folder until record, when kept files go under
        studio/assets/<project>/brush/<slug>/.
      execute: |
        Open the hub's Brushes tab ({pipeline.executes_through.app}, served by
        studio/hub/serve.py). The author designs the brush and exports the
        bundle; move it into the run folder. Then pack it:
          python {pipeline.executes_through.packer} pack <bundle> --out <run folder>
        or, for several brushes, `set ... --name "<set name>"`. Log the packer's
        output and run `inspect` on the result; put its output in the log.
      review: |
        Beside each decided parameter, the value the bundle holds, and whether
        it matches. Beside the imagery constraint from the attestation, how the
        tip and grain hold to it. Whether Procreate imported the file is the
        author's finding; record it as they say it, or as untested.
      record: |
        kind: brush. Method is the parameter table from `inspect`, whole, and
        the generator names, so the brush can be rebuilt in the designer.
        Artifacts: the .brush or .brushset as `export`, the bundle as
        `reference`. A parameter the author decided in the session is a
        Decision in Force.

  still-image:
    status: not_yet_implemented
    from: "skills/adobe_firefly.skill.md"
    kind: design
    makes: "One or more still images from a brief."
    requires_context:
      - gate: visual_identity
        needs: ["generated imagery: motifs, framing, texture"]
      - gate: color_science
        needs: ["palette"]
    executes_through:
      capability: "image generation"
    class: spend
    carries:
      - "A style reference is recorded in the note. A change supersedes it and keeps the old one."
    open:
      - "visual_identity section 7 is a declared gap."

  video-shot:
