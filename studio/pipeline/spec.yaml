      - gate: narrative_continuity
        needs: ["what persists between shots"]
      - gate: visual_identity
        needs: ["generated imagery: motifs, framing, texture"]
    executes_through:
      capability: "video generation"
    class: spend
    carries:
      - "Continuity lives in the note's Method and Decisions in Force, not in a live variable."
      - "A drift check after a run of shots."

  music-cue:
