# --------------------------------------------------------------------
# Stages. The same six for every pipeline.
#
# `checks` names what studio_run.py verifies before it will mark the stage
# done. The names are functions in studio_run.py; the spec test fails on an
# unknown one.
#
# {pipeline.<key>} is filled from the run's entry under `pipelines:`.
# --------------------------------------------------------------------
stages:
  - id: intake
    title: "1. Intake"
    checkpoint: true
    output_file: brief.md
    checks:
      - outputs_exist
      - note_path_set
    description: >
      Capture what is being made, in the author's words, before anything is
      looked up or generated.
    prompt: |
      Record the brief for a new {pipeline.kind} made through {pipeline}.
      Capture, in the author's own words wherever possible:
        - a working title
        - what is being made, in two to four sentences
        - whether this continues an existing Content MD or starts a new one
        - a project, ONLY if the author names one. Never infer a project.
      If it continues an existing note: read its Overview, Next Steps,
      Decisions in Force and Method in full before going on.
      If it is new: propose the note's path, <project>/<kind>/<slug>.md, or
      one-offs/<kind>/<slug>.md when there is no project. <kind> is
      {pipeline.kind}.
      Either way, tell the bookkeeper which note this run reads and writes:
        python studio/pipeline/studio_run.py note <run-id> <path>
      Do not create the note. It is first written at record, or earlier by a
      flush or a park.

      {pipeline.stage_notes.intake}

      Write the result as brief.md.

  - id: context
    title: "2. Context"
    checkpoint: true
    output_file: attestation.md
    checks:
      - outputs_exist
      - covers_every_need
      - no_unresolved
      - levels_are_backed
    description: >
      Resolve every constraint this pipeline needs, say where each one came
      from, and show it, before any tool is called.
    prompt: |
      Run `python studio/pipeline/studio_run.py facts <run-id>` first. It
      reports, for each gate this pipeline requires, what is needed from it,
      whether the file exists, what it answers and what it declares
      unresolved, and which notes name it.

      Read every gate file it lists, in full.

      If `facts` lists no gate, this pipeline needs no brand context. Write
      attestation.md saying so, with no table.

      Write one row for EACH needed constraint `facts` lists, using its
      wording in the Constraint cell. Resolve each on the ladder and stop at
      the first level that holds:

        Level         Source cell must hold                           State
        L0 AUTHORED   the gate file and `section N`                   resolved
        L1 RECALLED   [[note]] and the line "in double quotes",       resolved
                      copied exactly from its Decisions in Force
        L2 DERIVED    at least three [[notes]] of this kind           PROVISIONAL
        STATED        the author, and the date as YYYY-MM-DD          resolved
        L3            nothing                                         UNRESOLVED

      A section that a gate lists under `unresolved` does NOT answer the
      constraint, though the file exists. Such a row is L3.
      Inside a table cell, write the pipe of a wikilink alias as `\|`.

      If this continues an existing note, its Decisions in Force bind this run
      exactly as a gate does. List them under their own heading.

      A row left at L3 is UNRESOLVED. Do not fill it from general knowledge, a
      domain library, or the catalog. Ask the author. If the author states it,
      the row becomes STATED with today's date. If not, park the run:
        python studio/pipeline/studio_run.py park <run-id> --constraint <name> --needs "<what would resolve it>"

      Write attestation.md in this shape:

        # Attestation: <run-id>

        PIPELINE: {pipeline}
        NOTE:     <vault-relative path> (new | continuing)

        ## Context resolution

        | Constraint | Gate | Level | Source | State |
        |---|---|---|---|---|

        ## Decisions in force, from the note

        ## Key constraints extracted

      The bookkeeper checks that each row is backed the way its level must
      be. It cannot check that the section you cite says what you say it
      does. The author checks that, here.

  - id: recipe
    title: "3. Recipe"
    checkpoint: true
    output_file: recipe.md
    checks:
      - outputs_exist
    description: >
      Write down exactly what will be run, and where every value in it came
      from, before it is run.
    prompt: |
      Using brief.md and attestation.md, write the recipe: every tool call that
      execute will make, in order, with every parameter.
      Beside each parameter give its source: a row of the attestation, a
      Decision in Force, the author's brief, or a library node. A library node
      is never binding; say so where one is used.
      A parameter with no source does not belong in the recipe. Ask.
      State plainly:
        - what leaves this machine, and to where: {pipeline.leaves_machine}
        - the class of this pipeline: {pipeline.class}
        - what will be written outside the run folder, if anything

      {pipeline.stage_notes.recipe}

      Write the result as recipe.md.

  - id: execute
    title: "4. Execute"
    checkpoint: true
    requires_explicit_confirm: true
    output_file: execute_log.md
    checks:
      - confirmed
      - outputs_exist
      - confirmed_before_output
    description: >
      Run the recipe, and nothing that is not in it.
    prompt: |
      Only after the author has approved recipe.md and said to run it:
        python studio/pipeline/studio_run.py confirm <run-id> execute --words "<what the author said>"
      Then run the recipe as written.
      Call no tool whose name contains a word under `connectors: never`.

      {pipeline.stage_notes.execute}

      Write execute_log.md as it happens: each call as made, what came back,
      and anything that failed. Record what was done, not what was planned.
      Save artifacts in the run folder.

  - id: review
    title: "5. Review"
    checkpoint: true
    output_file: review.md
    checks:
      - outputs_exist
    description: >
      Check each output against each constraint that was attested.
    prompt: |
      For each output in execute_log.md, and each row of the attestation, one
      line: does the output hold to the constraint, and how was that checked.
      A failed output is a finding, not something to retry silently. A retry
      is a new execute, with its own go-ahead. Go back to it with:
        python studio/pipeline/studio_run.py back <run-id> --why "<what failed>"
      The author marks each output keep or discard.

      {pipeline.stage_notes.review}

      Write the result as review.md.

  - id: record
    title: "6. Record"
    checkpoint: true
    requires_explicit_confirm: true
    output_files: [note_update.md, record_plan.md]
    then: >
      advance straight after apply. The author's yes to record_plan.md was
      this stage's checkpoint.
    checks:
      - confirmed
      - outputs_exist
      - note_written
    description: >
      Update the one Content MD for this made thing. This stage automates the
      procedure in studio/vault/SCHEMA.md; it does not invent a new one.
    prompt: |
      Write note_update.md: the COMPLETE note as it should read afterwards,
      per studio/vault/SCHEMA.md.
        1. Append one Timeline entry for this session, headed
           `### <YYYY-MM-DD> · {pipeline} · <run-id>`. Build it from
           execute_log.md and review.md only. Never a step that was not taken.
        2. Rewrite Next Steps in full to describe the present.
        3. Add Decisions in Force. Mark a derived one PROVISIONAL, with its
           sources. Add each constraint the author STATED, with the date.
        4. Move answered Open Questions into Decisions in Force.
        5. Record conflicts with other notes under Contradictions, naming each.
        6. Update Method if a parameter changed.
        7. Set `updated` and `status`. Add {pipeline} to `pipelines`. List under
           `context_brand` the gates this note's decisions speak to, as
           SCHEMA.md means it; a decision derived or stated in this run always
           names its gate there.
      Leave every existing Timeline entry exactly as it is.

      {pipeline.stage_notes.record}

      Then preview it:
        python studio/pipeline/content_md.py plan <run-id>
      Show the author record_plan.md. Only after a clear yes:
        python studio/pipeline/studio_run.py confirm <run-id> record --words "<what the author said>"
        python studio/pipeline/content_md.py apply <run-id> --confirm
      This stage must never run without the author's explicit go-ahead.
